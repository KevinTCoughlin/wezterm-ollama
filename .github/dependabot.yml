version: 2
# Keep GitHub Actions pinned versions current. This plugin is pure Lua with no
# package manifest, so GitHub Actions is the only Dependabot-supported ecosystem.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
